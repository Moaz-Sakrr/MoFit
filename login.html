<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15171a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoFit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>دخول المتدربين | MoFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@300;400;500;700&family=Readex+Pro:wght@700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">

<aside class="auth-photo" aria-hidden="true">
  <img src="images/coach-hero.jpg" alt="">
</aside>

<main class="auth-main">
  <div class="auth-box">
    <div class="auth-brand">
      <a class="logo" href="index.html"><i></i>MoFit</a>
      <p>تمارين كل عضلة بالفيديو، وجداول التمرين الخاصة بك، في مكان واحد.</p>
    </div>

    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true">تسجيل الدخول</button>
      <button type="button" role="tab" id="tab-signup" aria-selected="false">حساب جديد</button>
    </div>

    <p class="notice" id="notice" hidden></p>

    <form id="form-login" class="auth-form">
      <div class="field"><label for="li-email">الإيميل</label><input id="li-email" type="email" autocomplete="email" required dir="ltr"></div>
      <div class="field"><label for="li-pass">كلمة السر</label><input id="li-pass" type="password" autocomplete="current-password" required dir="ltr"></div>
      <div class="captcha" id="cap-login"></div>
      <button class="btn btn-ink" type="submit">دخول</button>
      <button class="link" type="button" id="forgot">نسيت كلمة السر؟</button>
    </form>

    <form id="form-signup" class="auth-form" hidden>
      <div class="field"><label for="su-name">الاسم بالكامل</label><input id="su-name" autocomplete="name" required></div>
      <div class="field"><label for="su-phone">رقم الموبايل</label><input id="su-phone" type="tel" autocomplete="tel" required dir="ltr" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label for="su-email">الإيميل</label><input id="su-email" type="email" autocomplete="email" required dir="ltr"></div>
      <div class="field"><label for="su-pass">كلمة السر</label><input id="su-pass" type="password" autocomplete="new-password" minlength="6" required dir="ltr"><small>٦ حروف أو أرقام على الأقل</small></div>
      <div class="captcha" id="cap-signup"></div>
      <button class="btn btn-ink" type="submit">اعمل الحساب</button>
      <p class="hint">بعد ما تعمل الحساب، الكوتش هيفعّله أول ما اشتراكك يتأكد.</p>
    </form>

    <form id="form-reset" class="auth-form" hidden>
      <h2>كلمة سر جديدة</h2>
      <div class="field"><label for="rs-pass">كلمة السر الجديدة</label><input id="rs-pass" type="password" autocomplete="new-password" minlength="6" required dir="ltr"></div>
      <button class="btn btn-ink" type="submit">حفظ كلمة السر</button>
    </form>
  </div>
</main>

<script type="module" src="js/login.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
